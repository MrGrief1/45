<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подписка FlashSearch</title>
    <link rel="stylesheet" href="subscription-site.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
    <div class="background-gradient"></div>
    <main class="subscription-main" style="display:flex;align-items:center;justify-content:center;min-height:80vh;">
        <div class="checkout-card" style="max-width:560px;width:100%;">
            <h3>Активация по ключу</h3>
            <p class="checkout-subtitle">Введите выданный вам ключ, чтобы включить Pro-возможности.</p>
            <div class="payment-form" style="display:flex;gap:8px;align-items:center;">
                <input id="site-license-input" type="text" placeholder="XXXX-XXXX-..." style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid #374151;background:#111827;color:#e5e7eb;outline:none;">
                <button id="site-license-apply" class="primary-button">Активировать</button>
            </div>
            <p id="site-license-status" class="secure-note" style="margin-top:10px;">Ключ проверяется локально. Интернет не требуется.</p>
        </div>
    </main>

    <script>
        const input = document.getElementById('site-license-input');
        const btn = document.getElementById('site-license-apply');
        const statusEl = document.getElementById('site-license-status');
        const apply = () => {
            const key = (input.value || '').trim();
            if (!key) return;
            if (window.flashsearch && typeof window.flashsearch.setLicenseKey === 'function') {
                window.flashsearch.setLicenseKey(key);
                statusEl.textContent = 'Ключ отправлен в приложение.';
            } else {
                statusEl.textContent = 'Не удалось применить ключ. Обновите приложение.';
            }
        };
        btn.addEventListener('click', apply);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') apply(); });
    </script>
</body>
</html>
